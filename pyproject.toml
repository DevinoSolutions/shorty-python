[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shorty-py"
dynamic = ["version"]
description = "Official Python SDK for the Shorty API — AI summarization, transcription, and subtitling (aishorty.com)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Devino Solutions Inc.", email = "support@aishorty.com" }]
keywords = [
  "shorty",
  "aishorty",
  "summarization",
  "transcription",
  "subtitles",
  "captions",
  "ai",
  "sdk",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://aishorty.com/developers"
Documentation = "https://aishorty.com/docs/api"
Repository = "https://github.com/DevinoSolutions/shorty-python"
Issues = "https://github.com/DevinoSolutions/shorty-python/issues"

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-asyncio==1.3.0",
  "respx==0.23.1",
  "ruff==0.16.0",
  "ty==0.0.63",
]

[tool.hatch.version]
path = "src/shorty_py/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/shorty_py"]

[tool.hatch.build.targets.sdist]
include = ["src/shorty_py", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["shorty_py"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "TID", # flake8-tidy-imports
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["src"]
