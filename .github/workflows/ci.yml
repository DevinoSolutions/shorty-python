name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format check)
        run: ruff format --check .
      - name: ty (type check)
        run: ty check

  unit-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run unit tests
        run: >
          pytest tests --ignore=tests/smoke
          --cov=src/shorty_py --cov-report=term-missing --cov-fail-under=90

  build-and-import:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build sdist and wheel
        run: python -m pip install --upgrade pip build && python -m build
      - name: Install the built wheel
        run: pip install dist/*.whl
      # Runs from /tmp so it exercises the INSTALLED wheel, not ./src.
      - name: Import smoke on the installed wheel
        working-directory: /tmp
        run: |
          python - <<'PY'
          import shorty_py
          from shorty_py import AsyncShorty, RateLimitError, Shorty, verify_webhook_signature
          from shorty_py.types import Article

          assert shorty_py.__version__ == "0.1.0", shorty_py.__version__

          # The package must ship its typing marker or downstream type checkers
          # silently treat it as untyped.
          from pathlib import Path
          assert (Path(shorty_py.__file__).parent / "py.typed").is_file(), "py.typed missing"

          # Model round-trip, including the forward-compatibility bag.
          article = Article.from_wire({"id": "a1", "title": "T", "brand_new": 1})
          assert article.id == "a1" and article.extra["brand_new"] == 1

          # The client constructs and never leaks the key through repr.
          client = Shorty("shk_live_importsmoke")
          assert "shk_live_" not in repr(client)
          client.close()
          assert issubclass(RateLimitError, Exception)
          assert callable(AsyncShorty) and callable(verify_webhook_signature)
          print("import smoke OK", shorty_py.__version__)
          PY

  smoke:
    runs-on: ubuntu-latest
    needs: [lint, unit-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run prod smoke tests
        # Read-only calls against https://aishorty.com. Skips LOUDLY (not fails)
        # when SHORTY_API_KEY is absent, e.g. on forks and external PRs.
        env:
          SHORTY_API_KEY: ${{ secrets.SHORTY_API_KEY }}
        run: pytest tests/smoke -v
