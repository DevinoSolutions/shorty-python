# Nightly drift gate: the live /v1 spec is the source of truth, and this SDK
# pins a vendored copy at tests/fixtures/openapi-v1.json. When the server grows,
# renames, or drops an operation, this opens an issue instead of letting the SDK
# silently desync. Needs no API key — the spec endpoint is public.
name: Spec drift

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # NOTE: no `| tee` here. Piping the interpreter into tee makes the step's
      # exit status tee's (always 0), which would silently disarm this gate —
      # the script writes the report file itself instead.
      - name: Compare the live spec's operation set to the vendored fixture
        id: drift
        run: |
          python - <<'PY'
          import json
          import sys
          import urllib.error
          import urllib.request

          VENDORED = "tests/fixtures/openapi-v1.json"
          LIVE = "https://aishorty.com/api/openapi"
          # The default `Python-urllib/x.y` agent is refused (403) by the edge,
          # so identify the workflow explicitly.
          USER_AGENT = (
              "shorty-sdk-spec-drift/1.0 "
              "(+https://github.com/DevinoSolutions/shorty-python)"
          )

          lines: list[str] = []

          def emit(text: str) -> None:
              print(text)
              lines.append(text)

          def report_and_exit(code: int) -> None:
              with open("drift-report.txt", "w", encoding="utf-8") as handle:
                  handle.write("\n".join(lines) + "\n")
              sys.exit(code)

          def operations(document):
              methods = {"get", "post", "put", "patch", "delete"}
              return {
                  operation["operationId"]: f"{method.upper()} {path}"
                  for path, entries in document["paths"].items()
                  for method, operation in entries.items()
                  if method.lower() in methods
              }

          with open(VENDORED, encoding="utf-8") as handle:
              vendored = operations(json.load(handle))

          request = urllib.request.Request(LIVE, headers={"User-Agent": USER_AGENT})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  live = operations(json.load(response))
          except (urllib.error.URLError, ValueError) as exc:
              # Reaching the spec IS the gate. A fetch failure is a real signal
              # (endpoint moved, edge blocking CI), not something to swallow.
              emit(f"FAILED to fetch {LIVE}: {exc!r}")
              report_and_exit(1)

          added = sorted(set(live) - set(vendored))
          removed = sorted(set(vendored) - set(live))
          moved = sorted(op for op in set(live) & set(vendored) if live[op] != vendored[op])

          if not (added or removed or moved):
              emit(f"no drift: {len(live)} operations match the vendored fixture")
              report_and_exit(0)

          emit("DRIFT DETECTED")
          for label, ops in (("added", added), ("removed", removed), ("moved", moved)):
              for op in ops:
                  emit(f"- {label}: {op} ({live.get(op) or vendored.get(op)})")
          report_and_exit(1)
          PY

      - name: Open an issue when the spec has drifted
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            let report = 'The drift check failed before it could produce a report.'
            try { report = fs.readFileSync('drift-report.txt', 'utf8') } catch {}
            const title = 'Spec drift: /v1 has moved ahead of the vendored fixture'
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'spec-drift',
            })
            const body = [
              'The live spec at https://aishorty.com/api/openapi no longer matches',
              '`tests/fixtures/openapi-v1.json`.',
              '',
              '```',
              report.trim(),
              '```',
              '',
              'Re-vendor the fixture from `shortyapi/src/openapi/v1.json`, extend',
              '`OPERATION_MAP` in `tests/test_parity.py`, and implement the new',
              `operation. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n')
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['spec-drift'],
              })
            }
