# This workflow uses PyPI Trusted Publishing (OIDC) — no API token/password. It will
# FAIL until a trusted publisher for the `shorty-py` project is registered on PyPI.
# Because `shorty-py` does not exist on PyPI yet, use the PENDING publisher flow:
#   https://pypi.org/manage/account/publishing/ -> "Add a new pending publisher" ->
#   GitHub, with EXACTLY:
#     PyPI Project Name: shorty-py
#     Owner:             DevinoSolutions
#     Repository name:   shorty-python
#     Workflow name:     publish.yml
#     Environment name:  pypi
# Then in GitHub: Settings -> Environments -> New environment -> `pypi` (the name
# must match exactly or the OIDC claim validation fails).
# Do NOT dispatch this workflow before BOTH steps are done.
name: Publish

on:
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
